
services:
  - type: web
    name: gold-ai-live
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PRICE_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
